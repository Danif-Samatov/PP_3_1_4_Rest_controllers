<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments/header :: assets('User page')"></head>
<body>
<div th:replace="fragments/header :: navbar"></div>
<div class="d-flex">
    <div th:replace="fragments/header :: sidebar(active='user')"></div>
    <main class="content flex-grow-1">
        <h1>User information-page</h1>
        <div class="border bg-white">
            <div class="panel-heading">About user</div>
            <div class="p-3">
                <table class="table table-striped text-center mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Role</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td th:text="${#authentication.principal.id}"></td>
                        <td th:text="${#authentication.principal.firstName}"></td>
                        <td th:text="${#authentication.principal.lastName}"></td>
                        <td th:text="${#authentication.principal.age}"></td>
                        <td th:text="${#authentication.principal.email}"></td>
                        <td th:text="${#authentication.principal.rolesAsString}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
